<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="1986 newspaper clipping fragment, masthead and dateline torn away">
  <defs>
    <clipPath id="torn">
      <path d="M14 26 L38 10 L60 22 L92 6 L128 18 L160 8 L196 24 L236 12 L268 20 L308 8 L342 16 L380 6 L414 20 L452 10 L488 24 L520 12 L556 20 L592 8 L624 18 L662 10 L692 26 L706 52 L698 88 L708 130 L696 168 L704 210 L694 250 L702 292 L690 330 L700 372 L692 414 L702 452 L690 492 L700 528 L668 548 L630 538 L592 550 L552 540 L514 550 L474 542 L436 550 L398 540 L360 548 L322 540 L284 550 L246 538 L208 548 L170 540 L132 550 L94 538 L56 548 L24 534 L14 500 L22 462 L12 424 L22 386 L12 348 L22 310 L12 272 L22 234 L12 196 L22 158 L12 120 L20 84 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#torn)">
    <rect width="720" height="560" fill="#e7ddc2"/>

    <!-- masthead remnant: only the lower halves of the letters survive -->
    <text x="360" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="6" fill="#3a332a">THE STRAITS TIMES</text>
    <path d="M0 0 H720 V20 L688 26 L652 18 L616 30 L580 22 L544 32 L508 24 L472 34 L436 26 L400 34 L364 24 L328 32 L292 22 L256 30 L220 22 L184 30 L148 22 L112 30 L76 22 L40 30 L0 22 Z" fill="#e7ddc2"/>

    <!-- rule under masthead -->
    <rect x="30" y="58" width="660" height="3" fill="#3a332a"/>

    <!-- headline -->
    <text x="360" y="98" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#2b2620">ISLAND&#8217;S LARGEST MIXED-USE COMPLEX</text>
    <text x="360" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#2b2620">OPENS BY CITY HALL</text>
    <text x="360" y="154" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#4a4238">Ceremony officiated by the First Deputy Prime Minister before invited guests</text>

    <rect x="30" y="166" width="660" height="1.5" fill="#4a4238"/>

    <!-- column 1 -->
    <g font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#2f2a22">
      <text x="40" y="200" text-decoration="underline">SINGAPORE.</text>
      <text x="40" y="224">THE island&#8217;s largest mixed-use</text>
      <text x="40" y="243">development was officially</text>
      <text x="40" y="262">opened yesterday evening, in a</text>
      <text x="40" y="281">ceremony officiated by the First</text>
      <text x="40" y="300">Deputy Prime Minister.</text>
      <text x="40" y="326">The complex, henceforth referred</text>
      <text x="40" y="345">to in these columns as &#8220;the new</text>
      <text x="40" y="364">development&#8221;, occupies the site of</text>
      <text x="40" y="383">the island&#8217;s oldest school, which</text>
      <text x="40" y="402">moved to Grange Road in 1972</text>
      <text x="40" y="421">after more than a century at its</text>
      <text x="40" y="440">original city-centre grounds.</text>
      <!-- greeked remainder -->
      <g fill="#a99a77">
        <rect x="40" y="478" width="286" height="6"/>
        <rect x="40" y="492" width="270" height="6"/>
        <rect x="40" y="506" width="281" height="6"/>
        <rect x="40" y="520" width="200" height="6"/>
      </g>
    </g>

    <!-- dateline corner cut away -->
    <path d="M30 176 L118 176 L112 186 L104 192 L110 200 L118 208 L112 218 L30 218 Z" fill="#d9cfae" opacity=".55"/>
    <path d="M30 176 L120 176 L114 182 L30 182 Z" fill="#efe6cf"/>

    <!-- column 2 -->
    <g font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#2f2a22">
      <text x="360" y="200">Its designer is the Chinese-</text>
      <text x="360" y="219">American architect whose glass</text>
      <text x="360" y="238">pyramid would later rise in the</text>
      <text x="360" y="257">courtyard of the Louvre in Paris.</text>
      <text x="360" y="283">The podium houses shops and</text>
      <text x="360" y="302">offices, with a hotel rising above;</text>
      <text x="360" y="321">guests at yesterday&#8217;s ceremony</text>
      <text x="360" y="340">entered through a lobby finished</text>
      <text x="360" y="359">in polished granite.</text>
      <text x="360" y="385">Asked about the school that once</text>
      <text x="360" y="404">stood on the site, several guests</text>
      <text x="360" y="423">recalled the old playing field and</text>
      <text x="360" y="442">the bell that marked the periods.</text>
      <g fill="#a99a77">
        <rect x="360" y="478" width="296" height="6"/>
        <rect x="360" y="492" width="262" height="6"/>
        <rect x="360" y="506" width="290" height="6"/>
        <rect x="360" y="520" width="180" height="6"/>
      </g>
    </g>

    <!-- column rule -->
    <rect x="340" y="186" width="1.5" height="290" fill="#8c7f5f" opacity=".5"/>

    <!-- ink smudge where the name would be -->
    <ellipse cx="66" cy="355" rx="52" ry="9" fill="#2b2620" opacity=".82" transform="rotate(-2 66 355)"/>
    <ellipse cx="88" cy="350" rx="18" ry="6" fill="#2b2620" opacity=".6" transform="rotate(-2 88 350)"/>

    <!-- pencil marginalia -->
    <text x="600" y="540" font-family="'Comic Sans MS', 'Segoe Print', cursive" font-size="15" fill="#8a8578" transform="rotate(-4 600 540)">&#26680;&#23545;&#36807;&#65292;&#36824;&#26377;&#23384;&#26723;</text>

    <!-- halftone photo block, upper right -->
    <g>
      <rect x="500" y="176" width="176" height="120" fill="#c9bd9c"/>
      <rect x="500" y="176" width="176" height="120" fill="#3a332a" opacity=".18"/>
      <g fill="#3a332a" opacity=".3">
        <circle cx="516" cy="192" r="1.6"/><circle cx="536" cy="192" r="1.6"/><circle cx="556" cy="192" r="1.6"/><circle cx="576" cy="192" r="1.6"/><circle cx="596" cy="192" r="1.6"/><circle cx="616" cy="192" r="1.6"/><circle cx="636" cy="192" r="1.6"/><circle cx="656" cy="192" r="1.6"/>
        <circle cx="526" cy="204" r="1.6"/><circle cx="546" cy="204" r="1.6"/><circle cx="566" cy="204" r="1.6"/><circle cx="586" cy="204" r="1.6"/><circle cx="606" cy="204" r="1.6"/><circle cx="626" cy="204" r="1.6"/><circle cx="646" cy="204" r="1.6"/>
        <circle cx="516" cy="216" r="1.6"/><circle cx="536" cy="216" r="1.6"/><circle cx="556" cy="216" r="1.6"/><circle cx="576" cy="216" r="1.6"/><circle cx="596" cy="216" r="1.6"/><circle cx="616" cy="216" r="1.6"/><circle cx="636" cy="216" r="1.6"/><circle cx="656" cy="216" r="1.6"/>
        <circle cx="526" cy="228" r="1.6"/><circle cx="546" cy="228" r="1.6"/><circle cx="566" cy="228" r="1.6"/><circle cx="586" cy="228" r="1.6"/><circle cx="606" cy="228" r="1.6"/><circle cx="626" cy="228" r="1.6"/><circle cx="646" cy="228" r="1.6"/>
        <circle cx="516" cy="240" r="1.6"/><circle cx="536" cy="240" r="1.6"/><circle cx="556" cy="240" r="1.6"/><circle cx="576" cy="240" r="1.6"/><circle cx="596" cy="240" r="1.6"/><circle cx="616" cy="240" r="1.6"/><circle cx="636" cy="240" r="1.6"/><circle cx="656" cy="240" r="1.6"/>
        <circle cx="526" cy="252" r="1.6"/><circle cx="546" cy="252" r="1.6"/><circle cx="566" cy="252" r="1.6"/><circle cx="586" cy="252" r="1.6"/><circle cx="606" cy="252" r="1.6"/><circle cx="626" cy="252" r="1.6"/><circle cx="646" cy="252" r="1.6"/>
        <circle cx="516" cy="264" r="1.6"/><circle cx="536" cy="264" r="1.6"/><circle cx="556" cy="264" r="1.6"/><circle cx="576" cy="264" r="1.6"/><circle cx="596" cy="264" r="1.6"/><circle cx="616" cy="264" r="1.6"/><circle cx="636" cy="264" r="1.6"/><circle cx="656" cy="264" r="1.6"/>
        <circle cx="526" cy="276" r="1.6"/><circle cx="546" cy="276" r="1.6"/><circle cx="566" cy="276" r="1.6"/><circle cx="586" cy="276" r="1.6"/><circle cx="606" cy="276" r="1.6"/><circle cx="626" cy="276" r="1.6"/><circle cx="646" cy="276" r="1.6"/>
      </g>
      <!-- tower silhouette on the halftone -->
      <path d="M560 296 L560 214 L572 196 L584 214 L584 296 Z" fill="#2b2620" opacity=".35"/>
      <path d="M600 296 L600 232 L610 218 L620 232 L620 296 Z" fill="#2b2620" opacity=".28"/>
      <text x="588" y="312" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#4a4238">The new development seen from across the road.</text>
    </g>

    <!-- aging: specks and fold crease -->
    <g fill="#8c7f5f" opacity=".25">
      <circle cx="120" cy="500" r="1.2"/><circle cx="240" cy="80" r="1"/><circle cx="430" cy="330" r="1.4"/>
      <circle cx="620" cy="430" r="1.1"/><circle cx="80" cy="330" r="1.3"/><circle cx="330" cy="470" r="1"/>
      <circle cx="560" cy="150" r="1.1"/><circle cx="690" cy="300" r="1.2"/><circle cx="210" cy="240" r="1"/>
    </g>
    <path d="M0 282 H720" stroke="#8c7f5f" stroke-width="2" opacity=".12"/>
    <rect x="0" y="276" width="720" height="1" fill="#f3ecd8" opacity=".35"/>

    <!-- edge darkening -->
    <rect width="720" height="560" fill="none" stroke="#b3a37c" stroke-width="8" opacity=".25"/>
  </g>
</svg>
